[project]
name = "pocketledger"
version = "0.1.0"
description = "Piccola libreria di prova per l'AI Development Hub (sandbox)"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
